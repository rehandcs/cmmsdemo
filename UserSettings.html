<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Settings - Can Sport CMMS</title>
  <script src="api-config.js"></script>
  <script type="module" src="firebase-config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    .toggle-checkbox:checked { right: 0; border-color: #f97316; }
    .toggle-checkbox:checked + .toggle-label { background-color: #f97316; }
    #sidebar { transition: width 0.3s ease, transform 0.3s ease; }
    .sidebar-collapsed { width: 5rem !important; }
    .sidebar-collapsed .sidebar-text, .sidebar-collapsed .dropdown-icon { display: none !important; }
    .sidebar-collapsed .header-sidebar { justify-content: center !important; padding: 0 !important; }
    .sidebar-collapsed .sidebar-link, .sidebar-collapsed .submenu-trigger { justify-content: center !important; padding-left: 0 !important; padding-right: 0 !important; }
    .sidebar-collapsed .submenu-trigger > div { justify-content: center !important; width: 100%; }
    .sidebar-collapsed .bx { margin-right: 0 !important; }
    .sidebar-collapsed [id^="submenu-"] { display: none !important; }
    /* --- OVERRIDE UI GTRANSLATE --- */
  .gtranslate_wrapper {
    width: 100% !important;
    height: 100% !important;
    display: flex !important;
    align-items: center !important;
  }
  /* Mereset tampilan dropdown bawaannya */
  .gtranslate_wrapper select, 
  .gtranslate_wrapper .gt_selector {
    width: 100% !important;
    border: none !important;
    background: transparent !important;
    outline: none !important;
    box-shadow: none !important;
    color: #374151 !important; /* Warna text-gray-700 */
    font-family: inherit !important;
    font-weight: 500 !important;
    font-size: 14px !important;
    padding: 0 10px !important;
    cursor: pointer !important;
    appearance: none !important; /* Menghilangkan panah default browser jika pakai select */
  }
  /* Menyembunyikan elemen ekstra dari GTranslate yang tidak perlu */
  .gtranslate_wrapper a { text-decoration: none !important; }
  </style>
</head>
<body class="bg-gray-100 text-gray-700 font-sans h-screen flex overflow-hidden relative">

<!-- 1. Overlay untuk Mobile -->
  <div id="mobile-overlay" class="fixed inset-0 bg-black/50 z-30 md:hidden hidden" onclick="toggleSidebar()"></div>

  <!-- 2. Container Sidebar (Nanti diisi otomatis oleh JavaScript) -->
  <div id="sidebar-container" class="z-40"></div>

  <div class="flex-1 flex flex-col h-screen min-w-0 w-full relative">
  
  <header class="h-14 bg-white border-b border-gray-200 flex justify-between md:justify-end items-center px-4 md:px-6 shrink-0 z-10 shadow-sm">
      <!-- Tombol Menu Mobile (Hanya tampil di HP) -->
      <button onclick="toggleSidebar()" class="md:hidden text-gray-600 hover:text-orange-500 focus:outline-none">
        <i class='bx bx-menu text-2xl'></i>
      </button>

  <div class="flex items-center space-x-4 text-sm">
      <div class="flex items-center space-x-3">
          <img id="header-avatar" src="" alt="Profile" class="w-9 h-9 rounded-full shadow-sm border border-gray-200 object-cover">
          <div class="text-right">
              <span id="header-user-name" class="block text-sm font-bold text-gray-800">Loading...</span>
              <span id="header-user-role" class="block text-[10px] font-medium text-gray-500 uppercase tracking-wide">Loading...</span>
          </div>
      </div>
      <button onclick="handleLogout()" class="text-red-500 hover:text-white hover:bg-red-500 border border-red-500 font-bold px-4 py-1.5 rounded-md transition-colors duration-200 ml-4 shadow-sm">
        Logout
      </button>
    </div>
  </header>

    <main class="flex-1 overflow-y-auto p-8 bg-gray-50 flex justify-center items-start">
      <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-200 w-full max-w-4xl mt-2">

        <div class="flex justify-between items-center mb-8 border-b border-gray-100 pb-6">
            <div class="flex items-center gap-5">
                <div class="relative group cursor-pointer" onclick="document.getElementById('profile-upload').click()">
                    <img id="profile-preview" src="" class="w-20 h-20 rounded-full shadow-md border-4 border-orange-50 object-cover transition-transform group-hover:scale-105">
                    <div class="absolute inset-0 bg-black bg-opacity-40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                        <i class='bx bx-camera text-white text-2xl'></i>
                    </div>
                    <input type="file" id="profile-upload" class="hidden" accept="image/*" onchange="previewProfileImage(event)">
                </div>
                
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">User Settings</h2>
                    <p class="text-sm text-gray-500 mt-1">Manage your profile information and account security</p>
                </div>
            </div>
        </div>

        <form onsubmit="handleFormSubmit(event)">
          
          <h3 class="text-lg font-bold text-gray-800 mb-4 border-l-4 border-orange-500 pl-3">Informasi Profil</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Nama Lengkap</label>
                <input type="text" id="setting-name" 
                       class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none text-gray-800 bg-white font-medium transition-all">
              </div>
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Tanggal Join</label>
                <input type="date" id="setting-join-date" disabled 
                       class="w-full px-4 py-2.5 rounded-lg border border-gray-200 outline-none text-gray-500 bg-gray-100 cursor-not-allowed font-medium">
              </div>
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Email / Username</label>
                <input type="email" id="setting-email" 
                       class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none text-gray-800 bg-white font-medium transition-all">
              </div>
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Role Akses</label>
                <input type="text" id="setting-role" disabled 
                       class="w-full px-4 py-2.5 rounded-lg border border-gray-200 outline-none text-gray-500 bg-gray-100 cursor-not-allowed font-medium">
              </div>
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Change Language</label>
                
                <div class="relative w-full h-[46px] rounded-lg border border-gray-300 bg-white focus-within:border-orange-500 focus-within:ring-1 focus-within:ring-orange-500 transition-all overflow-hidden">
                    
                    <div class="gtranslate_wrapper w-full h-full"></div>
                    
                    <i class='bx bx-chevron-down absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-xl pointer-events-none'></i>
                </div>
                
                <p class="text-[10px] text-gray-400 mt-1">*Language changes will apply to all pages</p>
              </div>
          </div>

          <h3 class="text-lg font-bold text-gray-800 mb-4 border-l-4 border-orange-500 pl-3">Change Password</h3>
          <div class="space-y-6 mb-8 bg-gray-50 p-6 rounded-xl border border-gray-100">
              <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Current Password</label>
                <input type="password" id="cp_current" placeholder="Kosongkan jika tidak ingin mengubah password"
                       class="w-full md:w-1/2 px-4 py-2.5 rounded-lg border border-gray-300 focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none transition-all text-gray-800 bg-white">
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2 border-t border-gray-200 mt-4">
                  <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">New Password</label>
                    <input type="password" id="cp_new" placeholder="Masukkan password baru"
                           class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none transition-all text-gray-800 bg-white">
                  </div>
                  <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Confirm New Password</label>
                    <input type="password" id="cp_confirm" placeholder="Ulangi password baru"
                           class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none transition-all text-gray-800 bg-white">
                  </div>
              </div>
          </div>

          <div class="flex justify-end pt-4 border-t border-gray-200">
              <button type="submit" id="btn-save"
                      class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-8 py-3 rounded-lg transition-all shadow-md flex items-center text-sm">
                <i class='bx bx-save mr-2 text-lg'></i> Save Settings
              </button>
          </div>
        </form>

      </div>
    </main>
  </div>

  <div id="toast-success" class="fixed top-5 right-5 transform translate-x-full opacity-0 transition-all duration-300 z-[60] flex items-center w-full max-w-xs p-4 space-x-3 bg-white rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.1)] border-l-4 border-green-500">
      <div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-green-600 bg-green-100 rounded-lg">
          <i class='bx bx-check text-xl'></i>
      </div>
      <div class="ml-3 text-sm font-bold text-gray-800">Pengaturan berhasil disimpan!</div>
      <button type="button" onclick="closeToast()" class="ml-auto -mx-1.5 -my-1.5 bg-white text-gray-400 hover:text-gray-900 rounded-lg p-1.5 hover:bg-gray-100 inline-flex h-8 w-8 items-center justify-center transition-colors">
          <i class='bx bx-x text-xl'></i>
      </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    function handleLogout() {
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('userData');
        window.location.href = 'Login.html';
    }

    let selectedProfileBase64 = null;

    document.addEventListener('DOMContentLoaded', () => {
      loadSidebar();
      const userData = JSON.parse(localStorage.getItem('userData'));
        if (userData) {
            if (document.getElementById('header-user-name')) document.getElementById('header-user-name').innerText = userData.name;
            if (document.getElementById('header-user-role')) document.getElementById('header-user-role').innerText = userData.role || 'User';
            
            // Render Avatar (Pakai foto tersimpan atau buat avatar inisial otomatis)
            const avatarUrl = userData.profile_picture || `https://ui-avatars.com/api/?name=${encodeURIComponent(userData.name)}&background=f97316&color=fff&bold=true`;
            if (document.getElementById('header-avatar')) document.getElementById('header-avatar').src = avatarUrl;
            if (document.getElementById('profile-preview')) document.getElementById('profile-preview').src = avatarUrl;
            
            // Masukkan data ke dalam text input Setting Profile
            if (document.getElementById('setting-name')) document.getElementById('setting-name').value = userData.name;
            if (document.getElementById('setting-join-date')) document.getElementById('setting-join-date').value = userData.tanggal_join ? String(userData.tanggal_join).split('T')[0] : '';
            if (document.getElementById('setting-email')) document.getElementById('setting-email').value = userData.email;
            if (document.getElementById('setting-role')) document.getElementById('setting-role').value = userData.role || 'User';
            if (document.getElementById('setting-dept')) document.getElementById('setting-dept').value = userData.department || userData.dept || '-';
        }
    });

    function compressProfileImage(file, quality = 0.75) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = function() {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxWidth = 900;
                    const maxHeight = 900;
                    let width = img.width;
                    let height = img.height;
                    const scale = Math.min(maxWidth / width, maxHeight / height, 1);
                    width = Math.round(width * scale);
                    height = Math.round(height * scale);

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = reject;
                img.src = reader.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    // Preview dan konversi gambar foto profil menjadi Base64 yang lebih kecil supaya aman di localStorage
    async function previewProfileImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        try {
            selectedProfileBase64 = await compressProfileImage(file, 0.72);
            document.getElementById('profile-preview').src = selectedProfileBase64;
        } catch (error) {
            console.error('Gagal memproses foto profil:', error);
            Swal.fire('Gagal', 'Foto profil tidak bisa diproses, silakan coba foto lain.', 'error');
        }
    }

      async function uploadProfileToCloudinary(profileData) {
        const cloudForm = new FormData();
        cloudForm.append('file', profileData);
        cloudForm.append('upload_preset', 'cmmscsb');

        const cloudRes = await fetch('https://api.cloudinary.com/v1_1/bfvxjarw/image/upload', {
          method: 'POST',
          body: cloudForm
        });
        if (!cloudRes.ok) throw new Error('Upload foto profil ke Cloudinary gagal.');
        const cloudData = await cloudRes.json();
        return cloudData.secure_url;
      }

    async function handleFormSubmit(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-save');
        btn.innerHTML = `<i class='bx bx-loader-alt bx-spin mr-2 text-lg'></i> Menyimpan...`;
        
        try {
            const currentUser = JSON.parse(localStorage.getItem('userData'));
            
            // 1. Ambil data asli dari PostgreSQL untuk memvalidasi password
            const resUsers = await fetch('/api/users');
            const usersDB = await resUsers.json();
            const dbUser = usersDB.find(u => u.id === currentUser.id);

            if (!dbUser) {
                Swal.fire('Error', 'Data user tidak ditemukan di database.', 'error');
                resetBtn(); return;
            }

            const newName = document.getElementById('setting-name').value;
            const newEmail = document.getElementById('setting-email').value;
            
            const currentPass = document.getElementById('cp_current').value;
            const newPass = document.getElementById('cp_new').value;
            const confirmPass = document.getElementById('cp_confirm').value;

            let finalPassword = dbUser.password;

            // 2. Validasi perubahan password (jika user mengisi input password)
            if (currentPass || newPass || confirmPass) {
                if (currentPass !== dbUser.password) {
                    Swal.fire('Gagal!', 'Password saat ini (Current Password) salah.', 'error');
                    resetBtn(); return;
                }
                if (newPass !== confirmPass) {
                    Swal.fire('Gagal!', 'Konfirmasi Password Baru tidak cocok.', 'error');
                    resetBtn(); return;
                }
                finalPassword = newPass;
            }

            // 3. Update Database (Kirim data Profil & Password)
            const profilePictureUrl = selectedProfileBase64
              ? await uploadProfileToCloudinary(selectedProfileBase64)
              : dbUser.profile_picture || currentUser.profile_picture || null;

            const payload = {
                ...dbUser, // Membawa field lain (nik, role, dll) agar tidak hilang
                name: newName,
                email: newEmail,
                password: finalPassword,
              profile_picture: profilePictureUrl
            };

            const resUpdate = await fetch(`/api/users`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (resUpdate.ok) {
                const updatedUser = await resUpdate.json();
                
                // 4. Update data Session di localStorage
                const { password, ...sessionData } = updatedUser; // Jangan simpan password di localStorage
                
                // Simpan foto ke session agar tampil di semua halaman
                if (updatedUser.profile_picture) {
                    sessionData.profile_picture = updatedUser.profile_picture;
                } else if (currentUser.profile_picture) {
                    sessionData.profile_picture = currentUser.profile_picture;
                }

                try {
                    localStorage.setItem('userData', JSON.stringify(sessionData));
                } catch (error) {
                    console.error('localStorage quota exceeded pada foto profil:', error);
                    const fallbackUserData = { ...sessionData, profile_picture: null };
                    localStorage.setItem('userData', JSON.stringify(fallbackUserData));
                    Swal.fire('Peringatan', 'Foto terlalu besar untuk disimpan di browser, tapi data profil lain berhasil disimpan.', 'warning');
                }

                // 5. Update tampilan Header
                document.getElementById('header-user-name').innerText = sessionData.name;
                document.getElementById('header-avatar').src = sessionData.profile_picture || `https://ui-avatars.com/api/?name=${encodeURIComponent(sessionData.name)}&background=f97316&color=fff&bold=true`;
                
                // Bersihkan kolom password
                document.getElementById('cp_current').value = '';
                document.getElementById('cp_new').value = '';
                document.getElementById('cp_confirm').value = '';

                // Munculkan Toast Success
                const toast = document.getElementById('toast-success');
                toast.classList.remove('translate-x-full', 'opacity-0');
                setTimeout(() => { closeToast(); }, 3500);
            } else {
                const err = await resUpdate.json();
                Swal.fire('Gagal', err.error || 'Gagal menyimpan perubahan ke database.', 'error');
            }
        } catch (error) {
            console.error(error);
            Swal.fire('Error', 'Terjadi kesalahan saat menghubungi server.', 'error');
        }
        
        resetBtn();
    }

    function resetBtn() {
        const btn = document.getElementById('btn-save');
        btn.innerHTML = `<i class='bx bx-save mr-2 text-lg'></i> Save Settings`;
    }

    function closeToast() {
        const toast = document.getElementById('toast-success');
        toast.classList.add('translate-x-full', 'opacity-0');
    }

    function loadSidebar() {
      fetch('sidebar.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('sidebar-container').innerHTML = data;
          setActiveMenu();
        });
    }

    function setActiveMenu() {
      let path = window.location.pathname.split("/").pop();
      if (path === '' || path === '/') path = 'Index.html';
      const sidebarLinks = document.querySelectorAll('.sidebar-link');
      sidebarLinks.forEach(link => {
        if (link.getAttribute('href') === path || (path === 'Pickup.html' && link.getAttribute('href') === 'Pickup.html')) {
          link.classList.remove('text-gray-600', 'hover:bg-gray-50'); link.classList.add('bg-orange-500', 'text-white');
          const parentSubmenu = link.closest('[id^="submenu-"]');
          if (parentSubmenu) { parentSubmenu.classList.remove('hidden'); parentSubmenu.classList.add('block'); parentSubmenu.previousElementSibling.querySelector('.dropdown-icon').style.transform = 'rotate(180deg)'; }
        }
      });
    }


    function toggleSubmenu(id, element) {
      const sidebar = document.getElementById('sidebar');
      if (sidebar.classList.contains('sidebar-collapsed')) { sidebar.classList.remove('sidebar-collapsed'); }
      const submenu = document.getElementById(id);
      const icon = element.querySelector('.dropdown-icon');
      if (submenu.classList.contains('hidden')) {
        submenu.classList.remove('hidden'); submenu.classList.add('block'); icon.style.transform = 'rotate(180deg)';
      } else {
        submenu.classList.remove('block'); submenu.classList.add('hidden'); icon.style.transform = 'rotate(0deg)';
      }
    }
  </script>
  <script src="gtranslate.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
