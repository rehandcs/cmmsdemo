<html lang="en">
<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <style>

</head>
<body class="bg-gray-100 text-gray-700 font-sans h-screen flex overflow-x-auto relative">

<!-- 1. Overlay untuk Mobile -->

  <!-- 2. Container Sidebar (Nanti diisi otomatis oleh JavaScript) -->

  <header class="h-14 bg-white border-b border-gray-200 flex justify-between lg:justify-end items-center px-4 lg:px-6 shrink-0 z-10 shadow-sm">
      <!-- Tombol Menu Mobile (Hanya tampil di HP) -->

      <div class="flex-1 flex overflow-x-auto bg-white">

            <div class="py-2.5 border-r border-gray-200">Wednesday</div><div class="py-2.5 border-r border-gray-200">Thursday</div>
            <div class="py-2.5 border-r border-gray-200">Friday</div><div class="py-2.5 border-r border-gray-200 text-orange-600">Saturday</div>

  <div id="taskModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">

  <div id="ticketModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-[60]">

        <div>
          <!-- ID WO Disembunyikan -->

        <div>

        <div id="modalDelayReasonContainer" class="hidden mt-3">
          <label class="text-xs font-bold text-amber-500 uppercase tracking-wider block">Delay Reason</label>
          <p id="modalDelayReason" class="mt-1 text-gray-700 leading-relaxed bg-amber-50 p-3 rounded border border-amber-200 font-medium italic"></p>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-xs font-bold text-gray-400 uppercase tracking-wider block">Control Type</label>

          </div>
          <div>
            <label class="text-xs font-bold text-gray-400 uppercase tracking-wider block">Field Status</label>
            <span id="modalStatus" class="mt-1 inline-block px-2.5 py-0.5 rounded font-bold text-xs"></span>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4 pt-2 border-t border-gray-100">
          <div>
            <span class="text-xs text-gray-400 block"><i class='bx bx-user-circle mr-1'></i>Assigned Tech</span>
            <span id="modalUser" class="font-semibold text-gray-700 mb-2 block"></span>
            
            <span class="text-xs text-gray-400 mt-2 hidden" id="modalResponTimeLabel"><i class='bx bx-timer mr-1'></i>Respon Time</span>
            <span id="modalResponTime" class="font-semibold text-blue-600 hidden block"></span>
          </div>
          <div>
            <span class="text-xs text-gray-400 block"><i class='bx bx-time mr-1'></i>Request Time</span>
            <span id="modalTime" class="font-semibold text-gray-700 mb-2 block"></span>
            
            <span class="text-xs text-gray-400 mt-2 hidden" id="modalTotalDowntimeLabel"><i class='bx bx-stopwatch mr-1'></i>Total Downtime</span>
            <span id="modalTotalDowntime" class="font-bold text-red-600 font-mono text-sm hidden block">00:00:00</span>
          </div>
        </div>
      </div>
      <div class="bg-gray-50 px-6 py-3 border-t border-gray-200 flex justify-end gap-2">
        <button onclick="closeTicketModal()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs font-bold rounded transition-colors">Close</button>
        <button id="btnProsesTiket" onclick="openActionModal()" class="px-4 py-2 bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold rounded transition-colors shadow-sm"><i class='bx bx-edit mr-1'></i>Take Action</button>
      </div>
    </div>
  </div>

  <div id="actionModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-[70]">
    <div class="bg-white rounded-lg shadow-xl w-[350px] overflow-hidden transition-all transform scale-95" id="action-modal-box">
      <div class="bg-gray-800 px-6 py-4 flex justify-between items-center text-white">
        <h3 class="font-bold text-lg">Select Action</h3>
        <button onclick="closeActionModal()" class="text-gray-400 hover:text-red-400 transition-colors">

      </div>
      <div class="p-6 flex flex-col gap-3" id="actionButtonsContainer">

  <div id="delayModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-[80]">
    <div class="bg-white rounded-lg shadow-xl w-[400px] overflow-hidden transition-all transform scale-95" id="delay-modal-box">
      <div class="bg-amber-500 px-6 py-4 flex justify-between items-center text-white">
        <h3 class="font-bold text-lg"><i class='bx bx-time-five mr-2'></i>Delay Maintenance</h3>
        <button onclick="closeDelayModal()" class="text-white hover:text-amber-200 transition-colors">
          <i class='bx bx-x text-2xl'></i>
        </button>
      </div>
      <div class="p-6 space-y-4 text-sm">
        <div>
          <label class="text-xs font-bold text-gray-500 uppercase tracking-wider block mb-1">Reason for Delay</label>
          <textarea id="delay_reason" rows="3" class="w-full bg-gray-50 border border-gray-300 rounded p-2 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 text-gray-700" required></textarea>
        </div>
        <div>
          <label class="text-xs font-bold text-gray-500 uppercase tracking-wider block mb-1">Reschedule to</label>
          <input type="date" id="delay_date" class="w-full bg-gray-50 border border-gray-300 rounded p-2 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 text-gray-700" required>
        </div>
      </div>
      <div class="bg-gray-50 px-6 py-3 border-t border-gray-200 flex justify-end gap-2">
        <button onclick="closeDelayModal()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs font-bold rounded transition-colors">Cancel</button>
        <button onclick="submitDelay()" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded transition-colors shadow-sm">Save Delay</button>
      </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    let viewingDate = new Date(); 
    let dbScheduleData = []; 
    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    let downtimeInterval = null; // Interval untuk stopwatch
    
    // Akan di-update via DOMContentLoaded
    let currentUser = 'Admin Rehand';
    let currentSelectedTask = null;

    function parseWibDate(value) {
        if (!value || value === '-') return null;
        if (value instanceof Date) return value;

        const text = String(value).trim();
        const match = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{1,2}):(\d{1,2})$/);
        if (match) {
            const [, year, month, day, hour, minute, second] = match;
            return new Date(Date.UTC(Number(year), Number(month) - 1, Number(day), Number(hour), Number(minute), Number(second)));
        }

        const d = new Date(text);
        return Number.isNaN(d.getTime()) ? null : d;
    }

    function formatWibDateTime(value) {
        if (!value || value === '-') return '-';

        const text = String(value).trim();
        const match = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{1,2}):(\d{1,2})$/);
        if (match) {
            const [, year, month, day, hour, minute, second] = match;
            return `${day.padStart(2, '0')}/${month.padStart(2, '0')}/${year} ${hour.padStart(2, '0')}:${minute.padStart(2, '0')}:${second.padStart(2, '0')}`;
        }

        const d = parseWibDate(value);
        if (!d) return '-';
        return `${String(d.getUTCDate()).padStart(2, '0')}/${String(d.getUTCMonth() + 1).padStart(2, '0')}/${d.getUTCFullYear()} ${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}:${String(d.getUTCSeconds()).padStart(2, '0')}`;
    }

    function formatDurationGlobal(ms) {
        if (ms == null || isNaN(ms)) return '-';
        if (ms < 0) ms = 0;
        let totalSeconds = Math.floor(ms / 1000);
        let hours = Math.floor(totalSeconds / 3600);
        let minutes = Math.floor((totalSeconds % 3600) / 60);
        let seconds = totalSeconds % 60;
        return `${hours} h ${minutes} m ${seconds} s`;
    }

    function formatStopwatch(ms) {
        if (ms == null || isNaN(ms) || ms < 0) return '00:00:00';
        let totalSeconds = Math.floor(ms / 1000);
        let hours = Math.floor(totalSeconds / 3600);
        let minutes = Math.floor((totalSeconds % 3600) / 60);
        let seconds = totalSeconds % 60;
        return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function handleLogout() {
        localStorage.removeItem('userData');
        window.location.href = 'Login.html';
    }

    function toggleSubmenu(id, element) {
      const sidebar = document.getElementById('sidebar');
      if (sidebar.classList.contains('sidebar-collapsed')) { sidebar.classList.remove('sidebar-collapsed'); }
      const submenu = document.getElementById(id);
      const icon = element.querySelector('.dropdown-icon');
      if (submenu.classList.contains('hidden')) {
        submenu.classList.remove('hidden'); submenu.classList.add('block'); icon.style.transform = 'rotate(180deg)';
      } else {
        submenu.classList.remove('block'); submenu.classList.add('hidden'); icon.style.transform = 'rotate(0deg)';
      }
    }


    async function loadSchedule() {
        try {
            // Memanggil endpoint utama agar semua kelengkapan data tiket order sama persis
            const res = await fetch('/api/workorders');
            const data = await res.json();
            
            // Filter hanya tiket yang memiliki target jadwal
            dbScheduleData = data.filter(t => t.target_date).map(t => {
                const dateObj = new Date(t.target_date);
                const y = dateObj.getFullYear();
                const m = String(dateObj.getMonth() + 1).padStart(2, '0');
                const d = String(dateObj.getDate()).padStart(2, '0');
                t.date = `${y}-${m}-${d}`;
                return t;
            });
            renderCalendar();
            renderMissedTasks();
        } catch (err) { console.error("Failed to fetch schedule:", err); }
    }

    function renderMissedTasks() {
        const todayStr = new Date().toISOString().split('T')[0];
        const container = document.querySelector('.w-80.bg-gray-50'); 
        const existing = document.getElementById('missed-tasks-container');
        if(existing) existing.remove();

        const missed = dbScheduleData.filter(t => t.status !== 'COMPLETED' && t.status !== 'CLOSED' && t.date < todayStr);
        document.querySelector('.w-80.bg-gray-50 span.absolute').innerText = missed.length;

        let html = '<div id="missed-tasks-container" class="flex-1 overflow-y-auto p-4 space-y-3">';
        if(missed.length === 0) {
            html += `<p class="text-xs text-gray-400 text-center mt-5">Tidak ada tugas terlewat.</p>`;
        } else {
            missed.forEach(task => {
                const color = task.type === 'CORRECTIVE' ? 'red' : 'blue';
                
                let priorityBadge = '';
                if (task.priority && task.priority !== '-') {
                    let prioColor = 'bg-gray-400';
                    if (task.priority === 'Critical') prioColor = 'bg-red-600';
                    else if (task.priority === 'High') prioColor = 'bg-orange-500';
                    else if (task.priority === 'Medium') prioColor = 'bg-yellow-500';
                    else if (task.priority === 'Low') prioColor = 'bg-green-500';
                    priorityBadge = `<span class="text-[9px] font-bold tracking-wider ${prioColor} text-white px-1.5 py-0.5 rounded shadow-sm ml-1">${task.priority} Priority</span>`;
                }

                html += `
                <div onclick='openTicketDetail(${JSON.stringify(task).replace(/'/g, "&#39;")})' class="bg-white p-3 border-l-4 border-${color}-500 rounded shadow-sm cursor-pointer hover:shadow-md transition-shadow">
                    <div class="flex items-center mb-1">
                        <span class="text-[9px] font-bold text-white bg-${color}-500 px-1.5 py-0.5 rounded">${task.type}</span>
                        ${priorityBadge}
                    </div>
                    <h4 class="text-sm font-bold mt-1 text-gray-800">${task.machine_name || 'Mesin Tanpa Nama'}</h4>
                    <p class="text-xs font-mono text-gray-500 mt-0.5">${task.asset_id || '-'}</p>
                    <p class="text-xs font-mono text-gray-500 mt-0.5">${task.area || ''} ${task.location || '-'}</p>
                    <p class="text-xs text-gray-500 mt-1"><i class='bx bx-calendar-x text-red-500'></i> Terlewat: ${task.date}</p>
                    ${task.status === 'PENDING' && (task.delay_reason || task.reason) ? `
                    <div class="mt-2 bg-amber-50/80 border border-amber-200 rounded p-1.5">
                        <span class="block text-[9px] font-bold text-amber-600 uppercase mb-0.5">Reason for Delay</span>
                        <p class="text-[10px] text-gray-700 font-medium italic truncate">"${task.delay_reason || task.reason}"</p>
                    </div>` : ''}
                </div>`;
            });
        }
        html += '</div>';
        container.insertAdjacentHTML('beforeend', html);
    }

    function renderCalendar() {
        const year = viewingDate.getFullYear();
        const month = viewingDate.getMonth();
        document.getElementById('current-month-display').innerText = `${monthNames[month]} ${year}`;
        
        const calendarBody = document.getElementById('calendar-body');
        let html = '';

        const firstDayOfMonth = new Date(year, month, 1);
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const daysInPrevMonth = new Date(year, month, 0).getDate();
        let firstDayOfWeek = firstDayOfMonth.getDay() === 0 ? 6 : firstDayOfMonth.getDay() - 1; 

        for (let i = firstDayOfWeek - 1; i >= 0; i--) {
            html += `<div class="p-2 bg-gray-50 text-gray-300 border border-transparent"><div class="text-right text-base font-medium">${daysInPrevMonth - i}</div></div>`;
        }

        const today = new Date();
        for (let i = 1; i <= daysInMonth; i++) {
            const isToday = (i === today.getDate() && month === today.getMonth() && year === today.getFullYear());
            const borderClass = isToday ? 'border-[2px] border-orange-500 bg-orange-50/50' : 'border border-transparent bg-white hover:bg-orange-50/30';
            const textClass = isToday ? 'text-orange-600 font-extrabold' : 'text-gray-700 font-medium';
            const badgeToday = isToday ? '<span class="absolute top-1.5 left-1.5 text-[9px] bg-orange-500 text-white px-1.5 py-0.5 rounded shadow-sm">Today</span>' : '';
            
            const dateString = `${year}-${String(month+1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
            
            const unfinishedTasks = dbScheduleData.filter(task => task.date === dateString && task.status !== 'COMPLETED' && task.status !== 'CLOSED');
            
            let taskIndicator = '';
            if (unfinishedTasks.length > 0) {
                let dots = '';
                if (unfinishedTasks.some(t => t.type === 'CORRECTIVE')) {
                    dots += `<span class="w-2 h-2 rounded-full bg-red-500"></span>`;
                }
                if (unfinishedTasks.some(t => t.type === 'PREVENTIVE')) {
                    dots += `<span class="w-2 h-2 rounded-full bg-blue-500"></span>`;
                }
                taskIndicator = `<div class="mt-1 flex gap-1 flex-wrap">${dots}</div>`;
            }

            html += `
              <div class="p-2 relative cursor-pointer transition-all ${borderClass}" onclick="showModal(${i}, ${month}, ${year})">
                ${badgeToday}
                <div class="text-right text-base ${textClass}">${i}</div>
                ${taskIndicator}
              </div>
            `;
        }
        
        const cellsToFill = (Math.ceil((firstDayOfWeek + daysInMonth) / 7) * 7) - (firstDayOfWeek + daysInMonth);
        for (let i = 1; i <= cellsToFill; i++) {
            html += `<div class="p-2 bg-gray-50 text-gray-300 border border-transparent"><div class="text-right text-base font-medium">${i.toString().padStart(2, '0')}</div></div>`;
        }
        calendarBody.innerHTML = html;
    }

    function changeMonth(delta) { viewingDate.setMonth(viewingDate.getMonth() + delta); renderCalendar(); }
    function goToToday() { viewingDate = new Date(); renderCalendar(); }

    function showModal(day, month, year) {
      document.getElementById('modalDate').innerText = `${day} ${monthNames[month]} ${year}`;
      const dateString = `${year}-${String(month+1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const tasks = dbScheduleData.filter(t => t.date === dateString);

      let html = '';
      if (tasks.length > 0) {
        tasks.forEach(task => {
          const isDone = task.status === 'COMPLETED' || task.status === 'CLOSED';
          const bgClass = isDone ? 'bg-green-50' : 'bg-white shadow-sm';
          const badgeText = isDone ? `${task.type} - SELESAI` : task.type;
          const badgeColor = isDone ? 'bg-green-100 text-green-700' : (task.type === 'CORRECTIVE' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700');
          
          let priorityBadge = '';
          if (task.priority && task.priority !== '-') {
              let prioColor = 'bg-gray-400';
              if (task.priority === 'Critical') prioColor = 'bg-red-600';
              else if (task.priority === 'High') prioColor = 'bg-orange-500';
              else if (task.priority === 'Medium') prioColor = 'bg-yellow-500';
              else if (task.priority === 'Low') prioColor = 'bg-green-500';
              priorityBadge = `<span class="text-[10px] font-bold tracking-wider ${prioColor} text-white px-2 py-0.5 rounded shadow-sm ml-2">${task.priority} Priority</span>`;
          }

          html += `
            <div onclick='openTicketDetail(${JSON.stringify(task).replace(/'/g, "&#39;")})' 
                 class="p-3 rounded-lg border border-gray-200 ${bgClass} hover:border-blue-300 transition-colors cursor-pointer mb-2">
              <div class="flex items-center mb-1">
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded ${badgeColor} uppercase tracking-wider inline-block">${badgeText}</span>
                  ${priorityBadge}
              </div>
              <div class="text-sm font-bold text-gray-800">${task.machine_name || 'Mesin Tanpa Nama'}</div>
              <p class="text-xs font-mono text-gray-500 mt-0.5">${task.asset_id || '-'}</p>
              <p class="text-xs font-mono text-gray-500 mt-0.5">${task.area || ''} ${task.location || '-'}</p>
              <div class="text-xs text-gray-500 mt-1 truncate">"${task.issue_desc || '-'}"</div>
              ${task.status === 'PENDING' && (task.delay_reason || task.reason) ? `
              <div class="mt-2 bg-amber-50/80 border border-amber-200 rounded p-1.5">
                  <span class="block text-[9px] font-bold text-amber-600 uppercase mb-0.5">Reason for Delay</span>
                  <p class="text-[10px] text-gray-700 font-medium italic truncate">"${task.delay_reason || task.reason}"</p>
              </div>` : ''}
            </div>`;
        });
      } else { html = `<div class="text-center py-6 text-gray-400">Tidak ada jadwal.</div>`; }
      
      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('taskModal').classList.remove('hidden');
      setTimeout(() => document.getElementById('task-modal-box').classList.replace('scale-95', 'scale-100'), 10);
    }

    function closeTaskModal() {
      const box = document.getElementById('task-modal-box');
      if(box) { box.classList.remove('scale-100'); box.classList.add('scale-95'); }
      setTimeout(() => document.getElementById('taskModal').classList.add('hidden'), 150);
    }

    function openTicketDetail(task) {
      closeTaskModal();
      currentSelectedTask = task;
      
      document.getElementById('modalWOId').style.display = 'none';
      document.getElementById('modalTitle').innerText = task.machine_name || 'Mesin Tanpa Nama';
      document.getElementById('modalMachineId').innerText = task.asset_id || '-';
      document.getElementById('modalLocation').innerText = `${task.area || ''} ${task.location || '-'}`.trim();
      
      document.getElementById('modalDesc').innerText = `"${task.issue_desc}"`;
      
      const delayContainer = document.getElementById('modalDelayReasonContainer');
      const delayReasonEl = document.getElementById('modalDelayReason');
      if (task.status === 'PENDING' && (task.delay_reason || task.reason)) {
          if (delayContainer) delayContainer.classList.remove('hidden');
          if (delayReasonEl) delayReasonEl.innerText = `"${task.delay_reason || task.reason}"`;
      } else {
          if (delayContainer) delayContainer.classList.add('hidden');
      }

      document.getElementById('modalUser').innerText = task.technician || 'Belum Diambil';
      
      document.getElementById('modalTime').innerText = task.request_time ? formatWibDateTime(task.request_time) : '-';

      if (typeof downtimeInterval !== 'undefined' && downtimeInterval) clearInterval(downtimeInterval);
      const responLabel = document.getElementById('modalResponTimeLabel');
      const responTimeEl = document.getElementById('modalResponTime');
      const downLabel = document.getElementById('modalTotalDowntimeLabel');
      const downTimeEl = document.getElementById('modalTotalDowntime');

      if (task.start_time) {
          if(responLabel) responLabel.classList.remove('hidden');
          if(responTimeEl) {
              responTimeEl.classList.remove('hidden');
              const msRespon = (parseWibDate(task.start_time)?.getTime() ?? 0) - (parseWibDate(task.request_time)?.getTime() ?? 0);
              responTimeEl.innerText = formatDurationGlobal(msRespon);
          }
          if(downLabel) downLabel.classList.remove('hidden');
          if(downTimeEl) {
              downTimeEl.classList.remove('hidden');
              const dtStart = task.type === 'CORRECTIVE' ? (parseWibDate(task.request_time)?.getTime() ?? 0) : (parseWibDate(task.start_time)?.getTime() ?? 0);
               
              if (task.status === 'COMPLETED' || task.status === 'CLOSED' || task.end_time) {
                  const dtEnd = task.end_time ? (parseWibDate(task.end_time)?.getTime() ?? 0) : new Date().getTime();
                  downTimeEl.innerText = formatStopwatch(dtEnd - dtStart);
              } else {
                  function updateStopwatch() {
                      downTimeEl.innerText = formatStopwatch(new Date().getTime() - dtStart);
                  }
                  updateStopwatch();
                  downtimeInterval = setInterval(updateStopwatch, 1000);
              }
          }
      } else {
          if(responLabel) responLabel.classList.add('hidden');
          if(responTimeEl) responTimeEl.classList.add('hidden');
          if(downLabel) downLabel.classList.add('hidden');
          if(downTimeEl) downTimeEl.classList.add('hidden');
      }

      const imgContainer = document.getElementById('modalImageContainer');
      const imgEl = document.getElementById('modalImage');
      if (task.type === 'CORRECTIVE' && task.image_path) {
          // Cloudinary configuration
          // Cloud name: bfvxjarw
          // API KEY: 432919999388821
          // API SECRET: [Diisi sendiri]
          const isCloudinary = task.image_path.includes('res.cloudinary.com');
          imgEl.src = isCloudinary ? task.image_path : `https://res.cloudinary.com/bfvxjarw/image/upload/${task.image_path}`;
          imgContainer.classList.remove('hidden');
      } else {
          imgContainer.classList.add('hidden');
      }

      const typeBadge = document.getElementById('modalType');
      typeBadge.innerText = task.type;
      typeBadge.className = task.type === 'CORRECTIVE' ? "mt-1 inline-block px-2.5 py-0.5 rounded font-bold text-xs text-white bg-red-500" : "mt-1 inline-block px-2.5 py-0.5 rounded font-bold text-xs text-white bg-blue-500";

      const statusBadge = document.getElementById('modalStatus');
      statusBadge.innerText = task.status;
      if(task.status === 'OPEN') statusBadge.className = "mt-1 inline-block px-2.5 py-0.5 rounded font-bold text-xs bg-red-100 text-red-800";
      else if (task.status === 'IN PROGRESS') statusBadge.className = "mt-1 inline-block px-2.5 py-0.5 rounded font-bold text-xs bg-green-100 text-green-800";
      else statusBadge.className = "mt-1 inline-block px-2.5 py-0.5 rounded font-bold text-xs bg-amber-100 text-amber-800";

      const footerContainer = document.querySelector('#ticket-modal-box .border-t.flex.justify-end');
      if (footerContainer) {
          let html = '';
          if (task.status === 'COMPLETED' || task.status === 'CLOSED') {
              html = `<button onclick="closeTicketModal()" class="px-3 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs font-bold rounded transition-colors">Close</button>`;
          } else if (task.status === 'OPEN') {
              html = `
                <button onclick="closeTicketModal()" class="px-3 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs font-bold rounded transition-colors">Close</button>
                <button onclick="updateTicketAction('READY')" class="px-3 py-2 bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold rounded shadow-sm cursor-pointer"><i class='bx bx-check-circle mr-1'></i>Take Action</button>
              `;
          } else if ((task.status === 'IN PROGRESS' || task.status === 'PENDING') && task.technician === currentUser) {
              const isFixing = !!task.start_time;
              html = `
                <button onclick="window.location.href='Pickup.html'" class="px-3 py-2 bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold rounded shadow-sm cursor-pointer"><i class='bx bx-cog mr-1'></i>Ambil Sparepart</button>
                ${!isFixing ? `<button onclick="handleReadyToFix()" class="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded shadow-sm cursor-pointer"><i class='bx bx-wrench mr-1'></i>Siap Perbaiki</button>` : `<button onclick="goToCompletion()" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded shadow-sm cursor-pointer"><i class='bx bx-check-shield mr-1'></i>Penyelesaian Form</button>`}
                <button onclick="openDelayModal()" class="px-3 py-2 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded shadow-sm cursor-pointer"><i class='bx bx-time-five mr-1'></i>Tunda</button>
                <button onclick="updateTicketAction('CANCEL_READY')" class="px-3 py-2 bg-gray-200 hover:bg-gray-300 text-red-600 text-xs font-bold rounded shadow-sm cursor-pointer">Batal Ambil</button>
              `;
          } else {
              html = `
                <button onclick="closeTicketModal()" class="px-3 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs font-bold rounded transition-colors">Close</button>
                <button class="px-3 py-2 bg-gray-200 text-gray-500 text-xs font-bold rounded shadow-sm cursor-not-allowed">Dikerjakan ${task.technician || 'Teknisi Lain'}</button>
              `;
          }
          footerContainer.innerHTML = html;
      }

      document.getElementById('ticketModal').classList.remove('hidden');
      setTimeout(() => document.getElementById('ticket-modal-box').classList.remove('scale-95').add('scale-100'), 10);
    }

    function closeTicketModal() {
      if (typeof downtimeInterval !== 'undefined' && downtimeInterval) clearInterval(downtimeInterval);
      const box = document.getElementById('ticket-modal-box');
      if(box) { box.classList.remove('scale-100'); box.classList.add('scale-95'); }
      setTimeout(() => document.getElementById('ticketModal').classList.add('hidden'), 150);
    }

    function openActionModal() {
      closeTicketModal();
      const container = document.getElementById('actionButtonsContainer');
      
      if (container) {
              container.innerHTML = '';
              if (currentSelectedTask.status === 'OPEN') {
                  container.innerHTML = `
                     <button onclick="updateTicketAction('READY')" class="w-full flex items-center justify-center gap-2 py-3 bg-green-500 hover:bg-green-600 text-white font-bold rounded-md shadow-sm">
                        <i class='bx bx-check-circle text-xl'></i> Ambil Tiket (Ready Maintenance)
                     </button>
                  `;
              } else if ((currentSelectedTask.status === 'IN PROGRESS' || currentSelectedTask.status === 'PENDING') && currentSelectedTask.technician === currentUser) {
                  const isFixing = !!currentSelectedTask.start_time;
              container.innerHTML = `
                 ${!isFixing ? `<button onclick="handleReadyToFix()" class="w-full flex items-center justify-center gap-2 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-md shadow-sm mb-2">
                    <i class='bx bx-wrench text-xl'></i> Saya sudah siap memperbaiki
                 </button>` : `<button onclick="goToCompletion()" class="w-full flex items-center justify-center gap-2 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-md shadow-sm mb-2">
                    <i class='bx bx-check-shield text-xl'></i> Penyelesaian Form
                 </button>`}
                 <button onclick="openDelayModal()" class="w-full flex items-center justify-center gap-2 py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-md shadow-sm mb-2">
                    <i class='bx bx-time-five text-xl'></i> Tunda Maintenance
                 </button>
                 <button onclick="updateTicketAction('CANCEL_READY')" class="w-full flex items-center justify-center gap-2 py-3 bg-gray-200 hover:bg-gray-300 text-red-600 font-bold rounded-md shadow-sm">
                    Batal Ambil Tiket
                 </button>
              `;
          }
      }

      document.getElementById('actionModal').classList.remove('hidden');
      setTimeout(() => document.getElementById('action-modal-box').classList.remove('scale-95').add('scale-100'), 10);
    }

    function closeActionModal() {
      const box = document.getElementById('action-modal-box');
      if(box) { box.classList.remove('scale-100'); box.classList.add('scale-95'); }
      setTimeout(() => document.getElementById('actionModal').classList.add('hidden'), 150);
    }

    async function updateTicketAction(action, newDate = null, reason = null) {
        try {
            const res = await fetch('/api/workorders/action', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    id: currentSelectedTask.id, type: currentSelectedTask.type,
                    action: action, technician: currentUser, new_date: newDate, reason: reason
                })
            });
            if (res.ok) {
                Swal.fire({ icon: 'success', title: 'Berhasil', text: 'Status berhasil diperbarui!', timer: 1500, showConfirmButton: false });
                closeTicketModal();
                if(action === 'DELAY') closeDelayModal();
                loadSchedule();
            } else {
                const err = await res.json();
                Swal.fire('Gagal', err.error || 'Terjadi kesalahan.', 'error');
            }
        } catch (e) { 
            Swal.fire('Error', 'Gagal koneksi ke server database', 'error'); 
        }
    }

    function openDelayModal() {
      closeActionModal();
      document.getElementById('delayModal').classList.remove('hidden');
      setTimeout(() => document.getElementById('delay-modal-box').classList.remove('scale-95').add('scale-100'), 10);
    }

    function closeDelayModal() {
      const box = document.getElementById('delay-modal-box');
      if(box) { box.classList.remove('scale-100'); box.classList.add('scale-95'); }
      setTimeout(() => document.getElementById('delayModal').classList.add('hidden'), 150);
    }

    function submitDelay() {
        const d = document.getElementById('delay_date').value;
        const r = document.getElementById('delay_reason').value;
        if(!d || !r) return Swal.fire('Perhatian', 'Harap isi alasan dan tanggal!', 'warning');
        updateTicketAction('DELAY', d, r);
    }

    async function handleReadyToFix() {
        try {
            const currentTime = new Date().toISOString();
            
            // Mengirim request ke Backend untuk mencatat Start Time (dan Start Downtime khusus Preventive)
            await fetch('/api/workorders/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    id: currentSelectedTask.id, 
                    type: currentSelectedTask.type,
                    action: 'START_FIXING', 
                    technician: currentUser, 
                    start_time: currentTime,
                    downtime_start: currentSelectedTask.type === 'PREVENTIVE' ? currentTime : null
                })
            });

            Swal.fire({
                title: 'Silahkan perbaiki mesin',
                html: ` <b>${currentSelectedTask.machine_name || 'Tanpa Nama'}</b>.<br><br>Jika sudah selesai, klik tombol di bawah ini.`,
                icon: 'info',
                confirmButtonColor: '#f97316',
                confirmButtonText: 'Ke My Work Order',
                allowOutsideClick: false
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = 'TicketWO.html';
                }
            });
        } catch (error) {
            console.error("Error updating ready status:", error);
            // Tetap berikan popup meskipun ada error jaringan
            Swal.fire({
                title: 'Silahkan perbaiki mesin',
                html: `<b>${currentSelectedTask.machine_name || 'Tanpa Nama'}</b>.<br><br>Jika sudah selesai, klik tombol di bawah ini.`,
                icon: 'info',
                confirmButtonColor: '#f97316',
                confirmButtonText: 'Ke My Work Order',
                allowOutsideClick: false
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = 'TicketWO.html';
                }
            });
        }
    }

    function goToCompletion() {
        const targetHtml = currentSelectedTask.type === 'CORRECTIVE' ? 'CompletionCorrective.html' : 'CompletionPreventive.html';
        window.location.href = `${targetHtml}?asset_id=${currentSelectedTask.asset_id}`; 
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadSidebar();
      const userData = JSON.parse(localStorage.getItem('userData'));
      if (userData && userData.name) {
          currentUser = userData.name;
          document.getElementById('header-user-name').innerText = userData.name;
          document.getElementById('header-user-role').innerText = userData.role || 'User';
          const avatarEl = document.getElementById('header-avatar');
          document.getElementById('header-avatar').src = userData.profile_picture || `https://ui-avatars.com/api/?name=${encodeURIComponent(userData.name)}&background=f97316&color=fff&bold=true`;
      } else {
          const headerUserEl = document.querySelector('header span.text-gray-600');
          if (headerUserEl) currentUser = headerUserEl.innerText.trim() || 'Admin Rehand';
      }

      loadSchedule();
      
      const checkbox = document.getElementById('toggle1');
      const dot = document.querySelector('.dot');
      if (checkbox && dot) {
          checkbox.addEventListener('change', function() {
              if(this.checked) {
                  dot.style.transform = 'translateX(100%)';
              } else {
                  dot.style.transform = 'translateX(0)';
              }
          });
          if(checkbox.checked) dot.style.transform = 'translateX(100%)';
      }
    });

    function loadSidebar() {
      fetch('sidebar.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('sidebar-container').innerHTML = data;
          setActiveMenu();
          
        });
    }

    function setActiveMenu() {
      let path = window.location.pathname.split("/").pop();
      if (path === '' || path === '/') path = 'Index.html';
      const sidebarLinks = document.querySelectorAll('.sidebar-link');
      sidebarLinks.forEach(link => {
        if (link.getAttribute('href') === path || (path === 'AssetManagement.html' && link.getAttribute('href') === 'AssetManagement.html')) {
          link.classList.remove('text-gray-600', 'hover:bg-gray-50'); link.classList.add('bg-orange-500', 'text-white');
          const parentSubmenu = link.closest('[id^="submenu-"]');
          if (parentSubmenu) { parentSubmenu.classList.remove('hidden'); parentSubmenu.classList.add('block'); parentSubmenu.previousElementSibling.querySelector('.dropdown-icon').style.transform = 'rotate(180deg)'; }
        }
      });
    }
</script>
<script src="gtranslate.js"></script>
<script src="aiassistant.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
