<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    let masterAssets = [];
    let html5QrCode;
    let isProcessingQR = false; 

    function toggleSubmenu(id, element) {
      const submenu = document.getElementById(id);
      const icon = element.querySelector('.dropdown-icon');
      if (submenu.classList.contains('hidden')) {
        submenu.classList.remove('hidden'); submenu.classList.add('block');
        icon.style.transform = 'rotate(180deg)';
      } else {
        submenu.classList.remove('block'); submenu.classList.add('hidden');
        icon.style.transform = 'rotate(0deg)';
      }
    }


    function loadSidebar() {
      fetch('sidebar.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('sidebar-container').innerHTML = data;
          setActiveMenu();
        });
    }

    function setActiveMenu() {
      let path = window.location.pathname.split("/").pop();
      if (path === '' || path === '/') path = 'Index.html';
      const sidebarLinks = document.querySelectorAll('.sidebar-link');
      sidebarLinks.forEach(link => {
        if (link.getAttribute('href') === path || (path === 'AssetManagement.html' && link.getAttribute('href') === 'AssetManagement.html')) {
          link.classList.remove('text-gray-600', 'hover:bg-gray-50'); link.classList.add('bg-orange-500', 'text-white');
          const parentSubmenu = link.closest('[id^="submenu-"]');
          if (parentSubmenu) { parentSubmenu.classList.remove('hidden'); parentSubmenu.classList.add('block'); parentSubmenu.previousElementSibling.querySelector('.dropdown-icon').style.transform = 'rotate(180deg)'; }
        }
      });
    }

    async function fetchAssets() {
        try {
            const res = await fetch('/api/assets');
            if(res.ok) { masterAssets = await res.json(); }
        } catch (err) {
            masterAssets = JSON.parse(localStorage.getItem('cmms_assets')) || [];
        }
    }

    function checkAssetId() {
        const assetInput = document.getElementById('asset_id').value.trim().toLowerCase();
        const nameInput = document.getElementById('name_id');

        if (!assetInput) {
            nameInput.value = "";
            return;
        }

        // PERBAIKAN PENCARIAN (Mencari Nomor Asset ATAU Machine ID)
        const asset = masterAssets.find(a => {
            let dbNomor = a.nomor_asset ? String(a.nomor_asset).trim().toLowerCase() : "";
            let dbMachineId = a.machine_id ? String(a.machine_id).trim().toLowerCase() : "";
            return dbNomor === assetInput || dbMachineId === assetInput;
        });
        
        if (asset) {
            // Seragamkan inputan menjadi Nomor Asset Utama agar data yang tersimpan seragam
            document.getElementById('asset_id').value = asset.nomor_asset || assetInput;

            let mName = asset.machine_name || "";
            if (!mName || mName.trim() === "" || mName.trim() === "-") {
                nameInput.value = "Mesin Ditemukan (Tanpa Nama)";
            } else {
                nameInput.value = mName;
            }
        } else {
            nameInput.value = "Asset Not Found";
        }
    }

    function startScanner() {
        if (!html5QrCode) {
            html5QrCode = new Html5Qrcode("reader");
        }
        
        if (html5QrCode.isScanning) return; 
        isProcessingQR = false; 

        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText, decodedResult) => {
                if (isProcessingQR) return; 
                isProcessingQR = true; 

                document.getElementById('asset_id').value = decodedText;
                checkAssetId();
                stopScanner();
                Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, icon: 'success', title: 'QR Code Terbaca!' });
            },
            (errorMessage) => { /* abaikan error per frame */ }
        ).catch((err) => {
            Swal.fire('Error', 'Kamera tidak dapat diakses', 'error');
        });
    }

    function stopScanner() {
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().then(() => {
                isProcessingQR = false; 
            }).catch(err => {
                console.error("Stop failed", err);
            });
        }
    }

    // -- LOGIC SCHEDULE BARU SESUAI PERMINTAAN --
    let dateArray = [];

    function openScheduleModal() {
        const modal = document.getElementById('scheduleModal');
        const box = document.getElementById('schedule-modal-box');
        const today = new Date();
        const y = today.getFullYear();
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const d = String(today.getDate()).padStart(2, '0');
        document.getElementById('modal-start-date').value = `${y}-${m}-${d}`;
        
        modal.classList.remove('hidden');
        setTimeout(() => { box.classList.remove('scale-95'); box.classList.add('scale-100'); }, 10);
    }

    function closeScheduleModal() {
        const modal = document.getElementById('scheduleModal');
        const box = document.getElementById('schedule-modal-box');
        box.classList.remove('scale-100'); box.classList.add('scale-95');
        setTimeout(() => { modal.classList.add('hidden'); }, 150);
    }

    function generateSchedule() {
        const startDateStr = document.getElementById('modal-start-date').value;
        if(!startDateStr) {
            Swal.fire({ icon: 'warning', title: 'Oops...', text: 'Silakan pilih tanggal awal terlebih dahulu!', confirmButtonColor: '#3b82f6' });
            return;
        }

        const freq = document.querySelector('input[name="freq"]:checked').value;
        const [yStr, mStr, dStr] = startDateStr.split('-');
        const startDate = new Date(yStr, mStr - 1, dStr);
        let generatedDates = [];

        if (freq === 'daily') {
            generatedDates.push(startDateStr); 
        } else if (freq === 'weekly') {
            const targetMonth = startDate.getMonth(); 
            let d = new Date(startDate); 

            while (d.getMonth() === targetMonth) {
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                generatedDates.push(`${y}-${m}-${dd}`);
                
                d.setDate(d.getDate() + 7);
            }
        }

        let addedCount = 0;
        generatedDates.forEach(date => {
            if (!dateArray.includes(date)) {
                dateArray.push(date);
                addedCount++;
            }
        });

        dateArray.sort((a, b) => new Date(a) - new Date(b));
        renderDates();
        closeScheduleModal();

        if(addedCount > 0) {
            Swal.fire({
                toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true,
                icon: 'success', title: `${addedCount} tanggal berhasil ditambahkan`
            });
        } else {
             Swal.fire({
                toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true,
                icon: 'info', title: `Tanggal tersebut sudah ada di daftar`
            });
        }
    }

    async function handleFormSubmit(e) {

        if(dateArray.length === 0) {
            Swal.fire({ icon: 'warning', title: 'Attention', text: 'Please add at least one Maintenance Date.', confirmButtonColor: '#3b82f6' });
            return;
        }

        const nameInput = document.getElementById('name_id').value;
        if(nameInput === "Asset Not Found") {
            Swal.fire({ icon: 'warning', title: 'Data Tidak Valid', text: 'The asset number was not found in the master database.', confirmButtonColor: '#3b82f6' });
            return;
        }

        const btn = e.target.querySelector('button[type="submit"]');
        btn.innerHTML = "<i class='bx bx-loader-alt bx-spin mr-2'></i> Processing...";
        btn.classList.add('opacity-80', 'cursor-not-allowed');
        btn.disabled = true;

        const formData = new FormData();

        const submitDate = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Jakarta"}));
        
        let datetime = `${submitDate.getFullYear()}-${String(submitDate.getMonth() + 1).padStart(2, '0')}-${String(submitDate.getDate()).padStart(2, '0')} ${String(submitDate.getHours()).padStart(2, '0')}:${String(submitDate.getMinutes()).padStart(2, '0')}:${String(submitDate.getSeconds()).padStart(2, '0')}`;
        const userData = JSON.parse(localStorage.getItem('userData'));
        formData.append('user_name', userData ? userData.name : '');
        formData.append('asset_id', document.getElementById('asset_id').value);
        formData.append('kategori', document.getElementById('kategori').value);
        formData.append('issue_desc', document.getElementById('kategori').value);
        formData.append('datetime', datetime);
        formData.append('dates', JSON.stringify(dateArray));

        try {
            const res = await fetch('/api/preventive', { method: 'POST', body: formData });
            
            if(res.ok) {
                const assetIdVal = document.getElementById('asset_id').value;
                const assetData = masterAssets.find(a => (a.nomor_asset && String(a.nomor_asset).trim().toLowerCase() === assetIdVal.toLowerCase()) || (a.machine_id && String(a.machine_id).trim().toLowerCase() === assetIdVal.toLowerCase()));
                const area = assetData && assetData.area ? assetData.area : '-';
                const lokasi = assetData && assetData.location ? assetData.location : '-';
                
                const reportHtml = `
                    <div class="text-center mb-6">
                        <i class='bx bx-check-circle text-6xl text-blue-500 mb-3'></i>
                        <h2 class="text-2xl font-bold text-gray-800">Submit Berhasil!</h2>
                        <p class="text-gray-500">Jadwal Preventive Maintenance telah direkam.</p>
                    </div>
                    <div class="bg-gray-50 p-6 rounded-xl border border-gray-200 text-left space-y-3 text-sm">
                        <div class="grid grid-cols-3 border-b border-gray-200 pb-2"><span class="text-gray-500 font-medium">Work Order</span><span class="col-span-2 font-bold text-gray-800">: (Dibuat Otomatis oleh Sistem)</span></div>
                        <div class="grid grid-cols-3 border-b border-gray-200 pb-2"><span class="text-gray-500 font-medium">Waktu Pengajuan</span><span class="col-span-2 font-bold text-gray-800">: ${datetime}</span></div>
                        <div class="grid grid-cols-3 border-b border-gray-200 pb-2"><span class="text-gray-500 font-medium">Nama Mesin</span><span class="col-span-2 font-bold text-gray-800">: ${document.getElementById('name_id').value}</span></div>
                        <div class="grid grid-cols-3 border-b border-gray-200 pb-2"><span class="text-gray-500 font-medium">Nomor Asset</span><span class="col-span-2 font-bold text-gray-800">: ${assetIdVal}</span></div>
                        <div class="grid grid-cols-3 border-b border-gray-200 pb-2"><span class="text-gray-500 font-medium">Area / Lokasi</span><span class="col-span-2 font-bold text-gray-800">: ${area} / ${lokasi}</span></div>
                        <div class="grid grid-cols-3 border-b border-gray-200 pb-2"><span class="text-gray-500 font-medium">Maintenance</span><span class="col-span-2 font-bold text-blue-600">: Preventive</span></div>
                        <div class="grid grid-cols-3 pb-2"><span class="text-gray-500 font-medium">Inspection</span><span class="col-span-2 font-bold text-blue-500">: ${document.getElementById('kategori').value}</span></div>
                    </div>

    function getZoneName(location) {
        if (!location || location === '-') return null;
        const str = String(location).trim();
        
        // 1. Cari pola "Zona X"
        const zonaMatch = str.match(/Zona\s*(\d+)/i);
        if (zonaMatch) return `Zona ${zonaMatch[1]}`;
        
        // 2. Jika tidak ada "Zona" tapi ada "Line X", ubah otomatis jadi "Zona X"
        const lineMatch = str.match(/Line\s*(\d+)/i);
        if (lineMatch) return `Zona ${lineMatch[1]}`;
        
        return str;
    }

    function handleAreaChange() {
        const area = document.getElementById('areaSelect').value;
        const mapContainer = document.getElementById('mapContainer');
        const mapImage = document.getElementById('mapImage');
        const zoneSelect = document.getElementById('zoneSelect');
        const machineSearch = document.getElementById('machineSearch');
        const machineTableContainer = document.getElementById('machineTableContainer');

        if (area) {
            mapContainer.classList.remove('hidden');
            machineTableContainer.classList.add('hidden');
            if (machineSearch) machineSearch.value = ''; // Reset kotak pencarian
            
            // Set foto layout secara spesifik untuk masing-masing area
            if (area.toLowerCase() === 'cutting') {
                mapImage.src = '/uploads/layout_cutting.jpg'; // Pastikan nama file sesuai dengan yang ada di folder uploads
            } else if (area.toLowerCase() === 'stockfit') {
                mapImage.src = '/uploads/layout_stockfit.jpg'; 
            } else if (area.toLowerCase() === 'stiching') {
                mapImage.src = '/uploads/layout_stiching.jpg'; 
            } else if (area.toLowerCase() === 'assembling') {
                mapImage.src = '/uploads/layout_assembling.jpg'; 
            } else {
                mapImage.src = ''; 
            }

            // Filter zone/location dari masterAssets berdasarkan Area
            const filteredAssets = masterAssets.filter(a => a.area && a.area.toLowerCase() === area.toLowerCase());
            
            // Ekstrak nama Zona menggunakan fungsi pembantu
            const uniqueZones = [...new Set(filteredAssets.map(a => getZoneName(a.location)).filter(Boolean))];

            // Sortir agar berurutan (Zona 1, Zona 2, dst)
            uniqueZones.sort();

            zoneSelect.innerHTML = '<option value="" disabled selected>-- Pilih Zona --</option>';
            uniqueZones.forEach(zone => {
                zoneSelect.innerHTML += `<option value="${zone}">${zone}</option>`;
            });
        }
    }

    function handleZoneChange() {
        const area = document.getElementById('areaSelect').value;
        const zone = document.getElementById('zoneSelect').value;
        const searchKeyword = document.getElementById('machineSearch') ? document.getElementById('machineSearch').value.toLowerCase() : '';
        const machineTableContainer = document.getElementById('machineTableContainer');
        const machineTableBody = document.getElementById('machineTableBody');

        if (area && zone) {
            machineTableContainer.classList.remove('hidden');
            machineTableBody.innerHTML = '';

            const filteredAssets = masterAssets.filter(a => {
                if (!a.area || !a.location) return false;
                
                const areaMatch = a.area.toLowerCase() === area.toLowerCase();
                const aZone = getZoneName(a.location);
                const zoneMatch = aZone && aZone.toLowerCase() === zone.toLowerCase();
                
                let searchMatch = true;
                if (searchKeyword) {
                    const mName = (a.machine_name || '').toLowerCase();
                    const mAsset = (a.nomor_asset || '').toLowerCase();
                    const mBrand = (a.brand || '').toLowerCase();
                    searchMatch = mName.includes(searchKeyword) || mAsset.includes(searchKeyword) || mBrand.includes(searchKeyword);
                }
                
                return areaMatch && zoneMatch && searchMatch;
            });

            if (filteredAssets.length === 0) {
                machineTableBody.innerHTML = `<tr><td colspan="8" class="px-4 py-3 text-center text-gray-500">Tidak ada mesin di zona ini</td></tr>`;
            } else {
                filteredAssets.forEach(a => {
                    const assetId = a.nomor_asset || a.machine_id || '';
                    machineTableBody.innerHTML += `
                        <tr class="border-b border-gray-100 hover:bg-gray-50">
                            <td class="px-4 py-3 text-center">
                                <button onclick="openMachineCalendar('${assetId}')" class="bg-blue-100 text-blue-600 px-3 py-1.5 rounded-lg hover:bg-blue-500 hover:text-white transition-colors shadow-sm">
                                    <i class='bx bx-calendar-plus'></i> Set Jadwal
                                </button>
                            </td>
                            <td class="px-4 py-3 font-medium text-gray-800">${a.nomor_asset || '-'}</td>
                            <td class="px-4 py-3">${a.machine_name || '-'}</td>
                            <td class="px-4 py-3">${a.brand || '-'}</td>
                            <td class="px-4 py-3">${a.machine_type || '-'}</td>
                            <td class="px-4 py-3">${a.area || '-'}</td>
                            <td class="px-4 py-3">${a.location || '-'}</td>
                            <td class="px-4 py-3">${a.department || '-'}</td>
                        </tr>
                    `;
                });
            }
        }
    }

    // -- LOGIC KALENDER SPESIFIK MESIN --
    let currentCalendarDate = new Date();
    let currentAssetForCalendar = '';
    let selectedDatesForMachine = new Set(); // Menyimpan tanggal yang diceklis

    function openMachineCalendar(assetId) {
        currentAssetForCalendar = assetId;
        document.getElementById('calendar-machine-name').innerText = `Asset ID: ${assetId}`;
        
        selectedDatesForMachine.clear(); // Reset pilihan kalender setiap buka mesin baru
        document.getElementById('calendar-kategori').value = ""; // Reset kategori
        
        // Sembunyikan dan kosongkan input custom saat modal baru dibuka

        customInput.classList.add('hidden');
        
        renderCalendarGrid();
        
        const modal = document.getElementById('machineCalendarModal');
        const box = document.getElementById('machine-calendar-box');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        setTimeout(() => { box.classList.remove('scale-95'); box.classList.add('scale-100'); }, 10);

    function toggleCustomKategori() {
        const select = document.getElementById('calendar-kategori');
        const customInput = document.getElementById('calendar-kategori-custom');
        if (select.value === 'Others') {
            customInput.classList.remove('hidden');
            customInput.focus();

    function closeMachineCalendar() {
        const modal = document.getElementById('machineCalendarModal');
        const box = document.getElementById('machine-calendar-box');

        setTimeout(() => {

    function changeCalendarMonth(direction) {
        currentCalendarDate.setMonth(currentCalendarDate.getMonth() + direction);
        renderCalendarGrid();
    }

    function renderCalendarGrid() {
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';
        
        const year = currentCalendarDate.getFullYear();
        const month = currentCalendarDate.getMonth();
        
        const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        document.getElementById('calendar-month-year').innerText = `${monthNames[month]} ${year}`;
        
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        // Spasi kosong untuk awal bulan
        for (let i = 0; i < firstDay; i++) {
            grid.innerHTML += `<div class="p-2"></div>`;
        }
        
        // Kotakan Tanggal Kalender
        for (let i = 1; i <= daysInMonth; i++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
            const isSelected = selectedDatesForMachine.has(dateStr);
            
            const baseClass = "p-2 rounded-lg cursor-pointer text-sm font-bold transition-all relative flex justify-center items-center h-10 w-full";
            const colorClass = isSelected ? "bg-indigo-500 text-white shadow-md ring-2 ring-indigo-200" : "bg-gray-100 text-gray-700 hover:bg-indigo-100 hover:text-indigo-600";
            const iconHTML = isSelected ? `<i class='bx bx-check absolute top-0 right-0 text-md bg-white text-indigo-500 rounded-full shadow-sm'></i>` : '';
            
            grid.innerHTML += `
                <div onclick="toggleCalendarDate('${dateStr}')" class="${baseClass} ${colorClass}">
                    ${i}
                    ${iconHTML}
                </div>
            `;
        }
        
        document.getElementById('calendar-selected-count').innerText = selectedDatesForMachine.size;
    }

    function toggleCalendarDate(dateStr) {
        // Logika untuk memberikan tanda ceklis (toggle)
        if (selectedDatesForMachine.has(dateStr)) {
            selectedDatesForMachine.delete(dateStr);
        } else {
            selectedDatesForMachine.add(dateStr);
        }
        renderCalendarGrid(); // Render ulang kotakan tanggal
    }

    async function saveMachineCalendar() {
        if(selectedDatesForMachine.size === 0) {
            Swal.fire({ icon: 'info', title: 'Perhatian', text: 'Silakan klik tanggal di kalender terlebih dahulu.', confirmButtonColor: '#3b82f6' });
            return;
        }

        let kategori = document.getElementById('calendar-kategori').value;
        if(!kategori) {
            Swal.fire({ icon: 'warning', title: 'Perhatian', text: 'Silakan pilih Kategori Maintenance terlebih dahulu.', confirmButtonColor: '#3b82f6' });
            return;
        }

        // Ambil nilai dari isian teks jika user memilih "Others"
        if (kategori === 'Others') {
            const customKategori = document.getElementById('calendar-kategori-custom').value.trim();
            if (!customKategori) {
                Swal.fire({ icon: 'warning', title: 'Perhatian', text: 'Silakan ketik deskripsi maintenance pada kolom yang disediakan.', confirmButtonColor: '#3b82f6' });
                return;
            }
            kategori = customKategori;
        }

        const btn = document.getElementById('btn-save-calendar');
        btn.innerHTML = "<i class='bx bx-loader-alt bx-spin mr-1'></i> Processing...";
        btn.classList.add('opacity-80', 'cursor-not-allowed');
        btn.disabled = true;

        const dateArrayToSubmit = Array.from(selectedDatesForMachine);
        dateArrayToSubmit.sort((a, b) => new Date(a) - new Date(b));

        const submitDate = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Jakarta"}));
        let datetime = `${submitDate.getFullYear()}-${String(submitDate.getMonth() + 1).padStart(2, '0')}-${String(submitDate.getDate()).padStart(2, '0')} ${String(submitDate.getHours()).padStart(2, '0')}:${String(submitDate.getMinutes()).padStart(2, '0')}:${String(submitDate.getSeconds()).padStart(2, '0')}`;
        
        const userData = JSON.parse(localStorage.getItem('userData'));
        const formData = new FormData();
        formData.append('user_name', userData ? userData.name : '');
        formData.append('asset_id', currentAssetForCalendar);
        formData.append('kategori', kategori);
        formData.append('issue_desc', kategori);
        formData.append('datetime', datetime);
        formData.append('dates', JSON.stringify(dateArrayToSubmit));

        try {
            const res = await fetch('/api/preventive', { method: 'POST', body: formData });
            if(res.ok) {
                Swal.fire({
                    icon: 'success', 
                    title: 'Berhasil', 
                    text: 'Jadwal Preventive langsung tersimpan ke Database!',
                    confirmButtonColor: '#3b82f6'
                }).then(() => {
                    closeMachineCalendar();
                });
            } else {
                const errData = await res.json();
                Swal.fire({ icon: 'error', title: 'Error DB', text: errData.error || "Gagal menyimpan jadwal.", confirmButtonColor: '#3b82f6' });
            }
        } catch (err) {
            Swal.fire({ icon: 'error', title: 'Koneksi Gagal', text: 'Server atau Database tidak merespon.', confirmButtonColor: '#3b82f6' });
        } finally {
            btn.innerHTML = "Simpan Jadwal";
            btn.classList.remove('opacity-80', 'cursor-not-allowed');
            btn.disabled = false;
        }
    }
